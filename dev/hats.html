<!doctype html><html><body style="margin:0;background:#334">
<script type="module">
import * as THREE from 'three';
import { loadBodies, loadKit, getBody, getKit } from '../src/body.js';
import { createBodyRig } from '../src/rig.js';
const q = new URLSearchParams(location.search);
const looks = JSON.parse(q.get('looks'));
const view = q.get('view') || 'head';
await loadBodies(); await loadKit();
const cols = looks.length, W = cols * 300, H = view === 'head' ? 300 : 600;

window.__done = true;
</script></body></html>
