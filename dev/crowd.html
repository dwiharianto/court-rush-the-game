<!doctype html><html><body style="margin:0;background:#334">
<script type="module">
// Preview of the baked spectator poses: male on the top row, female below.
import * as THREE from 'three';
import { parseBody } from '../src/body.js';
import { createBodyRig } from '../src/rig.js';
import { bakeCrowd, buildCrowd } from '../src/crowd.js';
const ry = Number(new URLSearchParams(location.search).get('ry') || 0.5);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1600, 700); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x56708a);
sc.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.5)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 5); sc.add(d);
const bodies = {};
for (const g of ['male', 'female']) bodies[g] = parseBody(await (await fetch(`/src/assets/crowd-${g}.json`)).json());
const set = bakeCrowd(bodies, createBodyRig);
const names = Object.keys(set.male);
const mat = new THREE.MeshStandardMaterial({ roughness: 0.8, vertexColors: true });
names.forEach((n, i) => ['male', 'female'].forEach((g, j) => {
  const geo = set[g][n].clone();
  const wa = geo.getAttribute('wA'), wb = geo.getAttribute('wB');
  const cols = [[0.85, 0.6, 0.45], [0.8, 0.2, 0.2], [0.2, 0.25, 0.4], [0.15, 0.1, 0.05], [0.95, 0.95, 0.95], [0.3, 0.3, 0.6], [0.9, 0.5, 0.5]];
  const c = new Float32Array(wa.count * 3);
  for (let k = 0; k < wa.count; k++) {
    const w = [wa.getX(k), wa.getY(k), wa.getZ(k), wb.getX(k), wb.getY(k), wb.getZ(k)];
    const slot = w.findIndex((x) => x > 0.5) + 1;
    c.set(cols[slot], k * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(c, 3));
  const m = new THREE.Mesh(geo, mat); m.position.set(i * 1.1, j ? 0 : 2.1, 0); m.rotation.y = ry; sc.add(m);
}));
const cam = new THREE.PerspectiveCamera(30, 1600 / 700, 0.1, 100); cam.position.set(names.length * 0.55 - 0.5, 2.0, 9.5); cam.lookAt(names.length * 0.55 - 0.5, 1.9, 0);
r.render(sc, cam); window.done = true;
</script></body></html>
