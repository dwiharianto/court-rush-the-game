<!doctype html><html><body style="margin:0;background:#334">
<script type="module">
import * as THREE from 'three';
import { buildRacket } from '../src/human.js';
const W = 1200, H = 600, r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
r.toneMapping = THREE.NeutralToneMapping;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x56708a);
sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(2, 3, 4); sc.add(d);
const colours = [0x16181c, 0xf4f4f4, 0x1d3f8f, 0xb3261e];
colours.forEach((c, i) => { const k = buildRacket(c, 0xf4f4f4); k.position.set(i * 0.5 - 0.75, 0.3, 0); k.rotation.set(0, i === 3 ? 1.3 : -0.35, 0); sc.add(k); });
const cam = new THREE.PerspectiveCamera(28, W / H, 0.05, 20); cam.position.set(0, 0, 2.1); cam.lookAt(0, 0.05, 0);
r.render(sc, cam); window.__done = true;
</script></body></html>
