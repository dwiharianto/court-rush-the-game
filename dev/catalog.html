<!doctype html><html><body style="margin:0;background:#334;color:#fff;font:14px sans-serif">
<script type="module">
import * as THREE from 'three';
import { parseBody } from '../src/body.js';
const q=new URLSearchParams(location.search);
const gender=q.get('g')||'male';const items=(q.get('items')||'').split(',');const extra=(q.get('with')||'').split(',').filter(Boolean);
const cols=items.length, W=Math.min(1800,cols*300), H=600;
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(W,H);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x56708a);
sc.add(new THREE.HemisphereLight(0xffffff,0x555555,1.5));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(2,4,5);sc.add(d);
const TL=new THREE.TextureLoader();
const body=parseBody(await (await fetch(`/src/assets/body-${gender}.json`)).json());
const garment=async(id)=>{const j=await (await fetch(`/dev/preview/${gender}-${id}.json`)).json();return parseBody(j);};
const makeBody=(hidden)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(body.arrays.position),3));
 const idx=body.arrays.index;const keep=[];for(let t=0;t<idx.length;t+=3){if(hidden.has(idx[t])&&hidden.has(idx[t+1])&&hidden.has(idx[t+2]))continue;keep.push(idx[t],idx[t+1],idx[t+2]);}
 g.setIndex(keep);g.computeVertexNormals();return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xc98a64,roughness:0.6}));};
const makeG=async(gm)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(gm.arrays.position),3));
 g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(gm.arrays.uv),2));g.setIndex(new THREE.BufferAttribute(gm.arrays.index,1));g.computeVertexNormals();
 const m=gm.material;const mat=new THREE.MeshStandardMaterial({roughness:m.roughness??0.8,side:m.doubleSided?THREE.DoubleSide:THREE.FrontSide,alphaTest:m.alpha==='mask'?0.5:0,transparent:false});
 if(m.diffuse){const t=await TL.loadAsync(`/dev/preview/textures/${m.diffuse}`);t.colorSpace=THREE.SRGBColorSpace;mat.map=t;}
 if(m.normal){const t=await TL.loadAsync(`/dev/preview/textures/${m.normal}`);mat.normalMap=t;}
 return new THREE.Mesh(g,mat);};
const cam=new THREE.PerspectiveCamera(Number(q.get('fov')||24),(W/cols)/H,0.1,100);
const ry=Number(q.get('ry')||0);
for(let i=0;i<cols;i++){const grp=new THREE.Group();grp.position.x=i*2;grp.rotation.y=ry;sc.add(grp);
 const ids=[items[i],...extra].filter(Boolean);const gs=await Promise.all(ids.map(garment));
 const hidden=new Set();gs.forEach(gm=>gm.arrays.hidden.forEach(v=>hidden.add(v)));grp.add(makeBody(hidden));
 for(const gm of gs)grp.add(await makeG(gm));}
r.setScissorTest(true);
const look=(q.get('look')||'0,0.95,0').split(',').map(Number);const pos=(q.get('cam')||'0,1.0,6').split(',').map(Number);
for(let i=0;i<cols;i++){const x0=i*W/cols;r.setViewport(x0,0,W/cols,H);r.setScissor(x0,0,W/cols,H);cam.position.set(pos[0]+i*2,pos[1],pos[2]);cam.lookAt(look[0]+i*2,look[1],look[2]);r.render(sc,cam);}
window.__done=true;
</script></body></html>
